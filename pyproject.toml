[project]
name = "atlas-rag"
version = "0.1.0"
description = "Production-grade, observable, cost-aware, secured RAG API with hybrid retrieval, corrective and multi-hop orchestration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "langgraph>=0.2",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.24",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]
openai = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["atlas"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "fakeredis.*",
    "fastembed.*",
    "langgraph.*",
    "orjson.*",
    "prometheus_client.*",
    "qdrant_client.*",
    "redis.*",
    "respx.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
