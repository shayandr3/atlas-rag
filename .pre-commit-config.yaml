# The mypy hook runs via `language: system`: activate the project venv first
# (source .venv/Scripts/activate on Git Bash) so pre-commit can find mypy.
# The gitleaks hook builds a Go binary on first run; without Go locally, CI still
# enforces the secret scan (gitleaks job in .github/workflows/ci.yml).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (src, strict)
        entry: mypy src
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
